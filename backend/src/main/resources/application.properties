server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financial_fraud_assistant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:development-only-secret-change-before-deployment-2026}
jwt.expiration=86400000

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
