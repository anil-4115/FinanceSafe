server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.fail-on-missing-locations=false



jwt.secret=${JWT_SECRET:development-only-secret-change-before-deployment-2026}
jwt.expiration=86400000

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app.rate-limit.max-requests=100
app.rate-limit.window-minutes=1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.allow-email-free-reset=${APP_ALLOW_EMAIL_FREE_RESET:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
