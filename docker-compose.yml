version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: financial-fraud-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_fraud_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
